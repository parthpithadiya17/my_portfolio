{% load static %}
<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Blog</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- QUILL -->

    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet" />
    <!-- 1. LOAD QUILL FIRST -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <!-- 2. THEN YOUR JS -->
    <script src="{% static 'myapp/js/main.js' %}"></script>

    <style>
      body {
        background: #0b1017;
        color: white;
      }
      .ql-toolbar {
        background: #111827;
        border-radius: 8px 8px 0 0;
      }
      .ql-container {
        background: #020617;
        min-height: 300px;
      }
    </style>
  </head>

  <body class="bg-[#020617] text-white overflow-x-hidden">
    <div class="mx-auto max-w-3xl px-5 py-10 sm:px-6 sm:py-16">
      <h1 class="mb-6 text-2xl font-bold sm:text-3xl">
        {% if blog %}Edit Blog{% else %}Create Blog{% endif %}
      </h1>

      <form method="POST" id="blogForm">
        {% csrf_token %}
        <!-- TITLE -->
        <input
          name="title"
          value="{{ blog.title | default:'' }}"
          class="mb-4 w-full rounded border border-white/10 bg-slate-800 p-3" />

        <!-- EDITOR -->
        <div id="editor">
          {% if blog.content %}{{ blog.content|safe }}{% endif %}
        </div>

        <!-- HIDDEN FIELD -->
        <input type="hidden" name="content" id="hiddenContent" />

        <!-- SUBMIT -->
        <button
          type="submit"
          class="mt-6 w-full bg-cyan-400 text-black font-semibold py-3 rounded-lg shadow-lg hover:bg-cyan-300 hover:scale-[1.02] transition">
          🚀 Save Blog
        </button>
      </form>
    </div>

    <script>
      if (document.getElementById("editor")) {
        const quill = new Quill("#editor", { theme: "snow" });

        const form = document.getElementById("blogForm");

        form.addEventListener("submit", function () {
          document.getElementById("hiddenContent").value = quill.root.innerHTML;
        });
      }
    </script>
  </body>
</html>
