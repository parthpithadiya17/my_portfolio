{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ blog.title }}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              aqua: "#2DD4BF",
              gold: "#F59E0B",
              steel: "#94A3B8",
              blue: "#60A5FA",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}" />

    <!-- ICONS -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body class="bg-[#020617] text-white overflow-x-hidden">
    <!-- Fixed progress bar -->
    <div
      id="scroll-progress"
      class="fixed top-0 left-0 h-[2px] w-0 z-[9999] bg-gradient-to-r from-aqua via-blue to-gold shadow-[0_0_20px_rgba(45,212,191,.7)]"></div>

    <div class="mx-auto max-w-6xl px-5 py-12 sm:px-6 sm:py-16 lg:py-20">
      <div
        class="grid gap-10 lg:grid-cols-[minmax(0,720px)_240px] lg:gap-16 lg:justify-center">
        <!-- ================= LEFT ================= -->
        <div>
          <a
            href="/blog/"
            class="text-sm text-steel hover:text-white transition">
            ← Back
          </a>

          <h1 class="mt-6 text-3xl font-black leading-tight sm:text-5xl">
            {{ blog.title }}
          </h1>

          <p class="text-steel mt-3 text-sm">
            {{ blog.created_at|date:"M d, Y" }} · {{ blog.read_time }} min read
          </p>

          <!-- ACTIONS -->
          <div class="mt-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            {% if can_manage_blogs %}
            <div class="flex flex-wrap gap-3">
              <a
                href="{% url 'blog_edit' blog.slug %}"
                class="px-4 py-2 bg-yellow-400 text-black rounded-lg text-sm font-semibold hover:scale-105 transition">
                ✏ Edit
              </a>

              <a
                href="{% url 'blog_create' %}"
                class="px-4 py-2 bg-cyan-400 text-black rounded-lg text-sm font-semibold hover:scale-105 transition">
                ➕ New
              </a>
            </div>
            {% endif %}

            <!-- SHARE -->
            <div class="relative self-start sm:self-auto">
              <button
                id="shareBtn"
                class="flex items-center gap-2 px-4 py-2 text-sm border border-white/10 rounded-lg hover:bg-white/5 transition">
                <i data-lucide="share-2" class="w-4 h-4"></i>
                Share
              </button>

              <div
                id="shareMenu"
                class="hidden absolute right-0 mt-2 w-44 bg-[#0b1220] border border-white/10 rounded-lg overflow-hidden shadow-lg">
                <button
                  onclick="shareLinkedIn()"
                  class="flex items-center gap-2 w-full px-4 py-2 text-sm hover:bg-white/10">
                  <i data-lucide="linkedin" class="w-4 h-4"></i>
                  LinkedIn
                </button>

                <button
                  onclick="copyLink()"
                  class="flex items-center gap-2 w-full px-4 py-2 text-sm hover:bg-white/10">
                  <i data-lucide="link" class="w-4 h-4"></i>
                  Copy Link
                </button>
              </div>
            </div>
          </div>

          <!-- IMAGE -->
          <div class="mt-10 overflow-hidden rounded-xl">
            {% if blog.image %}
            <img src="{{ blog.image.url }}" class="h-52 w-full object-cover sm:h-72" />
            {% else %}
            <img
              src="{% static 'myapp/images/blog1.jpeg' %}"
              class="h-52 w-full object-cover sm:h-72" />
            {% endif %}
          </div>

          <!-- CONTENT -->
          <div
            class="blog-content mt-12 space-y-6 text-[17px] leading-8 text-gray-300">
            {{ blog.content|safe }}
          </div>
        </div>

        <!-- ================= TOC ================= -->
        <div class="hidden lg:block sticky top-28 h-fit">
          <p class="text-xs uppercase tracking-widest text-steel mb-5">
            Contents
          </p>

          <ul
            id="toc"
            class="space-y-3 text-sm text-gray-400 border-l border-white/10 pl-4"></ul>
        </div>
      </div>
    </div>

    <!-- ================= JS ================= -->

    <!-- Progress bar -->
    <script>
      window.addEventListener("scroll", () => {
        const progress = document.getElementById("scroll-progress");

        const scrollTop = window.scrollY;
        const docHeight =
          document.documentElement.scrollHeight - window.innerHeight;

        const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;

        progress.style.width = percent + "%";
      });
    </script>

    <!-- SHARE -->
    <script>
      const btn = document.getElementById("shareBtn");
      const menu = document.getElementById("shareMenu");

      btn.addEventListener("click", () => {
        menu.classList.toggle("hidden");
      });

      function copyLink() {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied");
      }

      function shareLinkedIn() {
        const url = encodeURIComponent(window.location.href);
        window.open(
          `https://www.linkedin.com/sharing/share-offsite/?url=${url}`,
          "_blank",
        );
      }
    </script>

    <!-- TOC -->
    <script>
      const toc = document.getElementById("toc");
      const headings = document.querySelectorAll(".blog-content h2");

      headings.forEach((h, i) => {
        const id = "section-" + i;
        h.id = id;

        const li = document.createElement("li");

        li.innerHTML = `
      <a href="#${id}" class="toc-link hover:text-cyan-400 transition">
        ${h.innerText}
      </a>
    `;

        toc.appendChild(li);
      });

      const tocLinks = document.querySelectorAll(".toc-link");

      window.addEventListener("scroll", () => {
        let current = "";

        headings.forEach((section) => {
          const sectionTop = section.offsetTop - 120;

          if (window.scrollY >= sectionTop) {
            current = section.getAttribute("id");
          }
        });

        tocLinks.forEach((link) => {
          link.classList.remove("text-cyan-400");

          if (link.getAttribute("href") === "#" + current) {
            link.classList.add("text-cyan-400");
          }
        });
      });
    </script>

    <!-- ICON INIT -->
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
